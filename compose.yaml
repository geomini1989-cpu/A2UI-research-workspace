services:
  research:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /app/.data
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - research-data:/app/.data
    restart: unless-stopped
volumes:
  research-data:
